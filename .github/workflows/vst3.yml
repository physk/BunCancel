name: Experimental Windows VST3
on: [push, pull_request]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SDK and native plugin
        run: cmake -S . -B build-vst3 -A x64 -DBUNCANCEL_BUILD_VST3=ON
      - name: Build plugin and SDK validator
        run: cmake --build build-vst3 --config Release --target BunCancel validator --parallel
      - name: Locate and validate the packaged module
        shell: pwsh
        run: |
          $module = Get-ChildItem build-vst3 -Recurse -Directory -Filter BunCancel.vst3 | Select-Object -First 1
          $validator = Get-ChildItem build-vst3 -Recurse -File -Filter validator.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (!$module -or !$validator) { throw 'Plugin bundle or validator missing' }
          & $validator.FullName $module.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $module.FullName package -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: BunCancel-experimental-Windows-x64-unsigned
          path: package/
          if-no-files-found: error
          retention-days: 14
