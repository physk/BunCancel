name: Portable engine and synthetic lab
on: [push, pull_request]

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m unittest discover -s tests/audio -p "test_*.py" -v
      - run: python tools/check_public_docs.py
      - if: runner.os == 'Linux'
        run: python tools/run_lab.py --runner build/buncancel-offline --out build/evaluation
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: development-audio-and-metrics
          path: build/evaluation/
          retention-days: 7
