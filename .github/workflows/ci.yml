name: Test lab bootstrap

on:
  push:
  pull_request:

jobs:
  fixture-tests:
    name: Deterministic WAV fixture checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixtures
        run: python -m unittest discover -s tests/audio -p "test_*.py" -v
      - name: Generate sample corpus
        run: python tests/audio/generate_fixtures.py --out build/fixtures --seconds 2.0
      - name: Validate neutral project files
        run: python tools/check_public_docs.py
      - name: Upload synthetic corpus for inspection
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-audio-fixtures
          path: build/fixtures/
          retention-days: 7
